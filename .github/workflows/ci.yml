# CloudSentinel — continuous integration.
#
# What this is: the automated check that runs on every push and pull request to
# `main`. It type-checks the project, lints it, runs the full test suite, and
# proves the scanner itself still executes end to end.
#
# Where it fits in the architecture: this is the outermost safety net around the
# collector (lib/collectors/), the rule engine (lib/rules/), and the CLI entry
# points (scripts/). Nothing here is part of the product — it exists so that a
# change which breaks one of those is caught before it reaches the public repo.
#
# The reason this workflow can exist at all is a deliberate design decision made
# in phases 1 and 2: every test runs against pure functions and the committed
# `fixtures/inventory.json` snapshot. No LocalStack container, no AWS
# credentials, and no LocalStack auth token are needed. A CI job that required a
# live cloud emulator would need secrets, would be slow, and would fail for
# reasons unrelated to the code being changed.
#
# Two things were added in phase 6 and neither breaks that property. A Postgres
# service container backs the database integration tests and the anomaly
# ingestion step; it holds nothing but throwaway data for the length of one job.
# And Python runs the ML anomaly layer, whose input is *generated* rather than
# checked in — `npm run logs:gen` is deterministic, so CI rebuilds byte for byte
# the same activity log the models were tuned against, without the repository
# carrying tens of megabytes of JSON.
#
# The workflow therefore still needs no secret of any kind.
#
# SECURITY: this workflow has no secrets and needs none. `permissions` is
# narrowed to read-only contents below, so even if a dependency in the build
# were compromised it could not push commits, open pull requests, or publish
# packages using the workflow's token. That is the principle of least privilege
# applied to CI itself — appropriate for a project that audits other people's
# permissions.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only ever reads the repository.
permissions:
  contents: read

# On a pull request branch, a new push cancels the run still in flight: during
# rapid iteration the earlier runs are obsolete before they finish, and their
# results are nobody's business but the author's.
#
# On `main` every commit runs to completion instead. This project is built in
# small, frequent commits that are pushed individually, and the point of that
# history is being able to see each step land — a cancelled run leaves a grey
# icon that is indistinguishable at a glance from a failure, which makes the
# commit log harder to read rather than easier. The repository is public, so
# Actions minutes are free and there is nothing to save by cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    # A throwaway Postgres for the integration tests in lib/db/*.dbtest.ts.
    # GitHub starts it before the job and destroys it afterwards, so the tests
    # get a real database without this workflow needing any secret — the
    # password below protects a container that exists for the length of one job
    # and is reachable only from it.
    #
    # The unit suite (`npm test`) deliberately does not use this: it must stay
    # runnable with no database at all, which is what keeps it fast and what
    # lets anyone clone the repo and run it immediately.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloudsentinel
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
          POSTGRES_DB: cloudsentinel
        ports:
          - 5432:5432
        # Without this the job races the container: Postgres accepts TCP
        # before it is ready to serve queries, and the first migration fails
        # intermittently.
        options: >-
          --health-cmd "pg_isready -U cloudsentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to the major version used for development on this project.
          # Node 24 matters specifically: the test suite and both CLIs import
          # `.ts` files directly, relying on Node's built-in type stripping.
          # An older major would fail to load a single file.
          node-version: "24"
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins and fails if the lockfile and package.json
      # disagree, so a CI run can never silently resolve a different dependency
      # tree than the one that was reviewed.
      - name: Install dependencies
        run: npm ci

      # Fails the build on a known high-severity vulnerability in a dependency
      # that actually ships.
      #
      # `--omit=dev` is the important flag. The development tree includes
      # TypeScript, ESLint and the build toolchain, none of which runs in
      # production or processes untrusted input, and an advisory against one of
      # them is not a vulnerability in the deployed application. Auditing
      # everything would mean routinely overriding the gate, which is the same
      # as not having one.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Next.js generates `next-env.d.ts` and `.next/types/` — which define
      # globals such as `LayoutProps` that app/layout.tsx uses — and both are
      # gitignored, so neither exists in a fresh checkout. Without this step the
      # type-check fails in CI while passing locally, purely because a local
      # machine has run `next dev` at some point. `typegen` produces just those
      # definitions, so CI does not have to run a full production build to
      # type-check a project whose dashboard is not written yet.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # The unit suite: the collectors, the policy helpers, every rule, the
      # engine, the auth primitives, and the dashboard's formatting helpers.
      # Includes the Phase 3 contract test, which asserts that the real rule set
      # over the real fixture produces exactly the findings
      # scripts/seed-localstack.ts promises.
      #
      # No count is quoted here on purpose — it goes stale on every commit that
      # adds a test, and a stale number in a comment is worse than none.
      - name: Test
        run: npm test

      # Integration tests against the service container above. They create and
      # drop their own database, so they cannot interfere with anything else.
      - name: Test (database)
        run: npm run test:db
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: cloudsentinel
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
          POSTGRES_DB: cloudsentinel

      # ---------------------------------------------------------------------
      # The ML anomaly layer
      # ---------------------------------------------------------------------
      #
      # Python is needed from here on. The version is pinned to a major line
      # rather than left floating: ml/requirements.txt specifies version floors
      # rather than exact pins so the project still installs in a year, which
      # means the resolved dependency set can drift, and pinning the interpreter
      # at least keeps one variable fixed.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install the ML dependencies
        run: npm run ml:setup

      # Generate the activity log rather than checking one in.
      #
      # This is the step that justifies not committing fixtures/cloudtrail.json.
      # Generation is deterministic — same seed, byte-identical output on any
      # machine — so CI rebuilds the exact dataset the models were tuned
      # against, in about a fifth of a second, instead of the repository
      # carrying 27MB of JSON that every clone would have to download.
      - name: Generate the synthetic activity log
        run: npm run logs:gen

      - name: Detect anomalies
        run: npm run ml:detect

      # The regression gate.
      #
      # `--require-recall` fails the build if the Isolation Forest stops finding
      # the injected attacks. The threshold is 0.6 against a current result of
      # 0.8 (four of five scenarios), and that gap is deliberate: everything in
      # the pipeline is seeded and deterministic, but scikit-learn is installed
      # by version floor rather than exact pin, so a future release could move
      # a marginal window across the alert budget boundary. A gate set exactly
      # at today's number would then fail for a reason that is not a regression.
      #
      # Dropping to three of five, on the other hand, means something genuinely
      # broke — most likely in feature extraction, which is where every previous
      # mistake in this layer has been.
      #
      # The fifth scenario (off_hours_access) is missed by both models by
      # design; it is the deliberately weak signal, and the evaluation reports
      # that honestly rather than tuning until it disappears.
      - name: Evaluate the detectors against ground truth
        run: npm run ml:evaluate -- --require-recall 0.6

      # Proves migration 0003 applies and the detections actually load into
      # Postgres — the validator in lib/anomalies/ingest.ts is unit-tested, but
      # only a real insert exercises the schema's constraints and the array and
      # JSONB column types.
      - name: Store the detections in Postgres
        run: npm run db:migrate && npm run ml:save
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: cloudsentinel
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
          POSTGRES_DB: cloudsentinel

      # A production build, which type-checking alone does not replace.
      #
      # This step exists because of a specific bug it would have caught: a
      # client component imported a value from lib/db/triage.ts, which reaches
      # `pg` through its own imports, so the bundler tried to put the PostgreSQL
      # driver into a browser bundle. `tsc` was perfectly happy — every type was
      # correct — and the failure appeared only at build time. Any rule about
      # what may cross the server/client boundary is enforced by the bundler, so
      # the bundler has to run in CI.
      - name: Build
        run: npx next build
        env:
          # lib/auth/jwt.ts refuses to load without a secret of at least 32
          # characters, and the build imports it while prerendering. This value
          # signs nothing that outlives the job and protects nothing — the real
          # one lives in .env and is never committed.
          CLOUDSENTINEL_JWT_SECRET: ci-build-only-not-a-secret-value-32chars

      # Proves the scanner CLI itself still runs, parses its arguments, and can
      # evaluate a real inventory — the tests exercise the engine directly and
      # would not catch a broken entry point.
      #
      # Deliberately NOT gated with `--fail-on`: fixtures/inventory.json is a
      # snapshot of intentionally-insecure fixtures, so it contains critical
      # findings by design and any threshold would fail every run. In a real
      # deployment this is where `--fail-on high` would go.
      - name: Scan the committed fixture
        run: npm run scan -- --input fixtures/inventory.json --severity critical

  # ==========================================================================
  # Phase 7: containers and Kubernetes
  # ==========================================================================
  #
  # Builds both images and deploys the whole project into a throwaway Kubernetes
  # cluster, then checks that the security controls it claims are actually in
  # force.
  #
  # This is a separate job rather than more steps on `verify`, for two reasons.
  # It is slow — a container build plus a cluster creation — and running it in
  # parallel keeps the fast feedback of the type-check and test suite
  # unaffected. And it needs nothing `verify` produces, so making it wait would
  # only add latency.
  #
  # Why deploy for real rather than lint the YAML: almost everything worth
  # getting wrong here is invisible to a schema check. A readiness probe
  # pointing at the wrong path, a Secret key that does not match the name the
  # container reads, a certificate whose Subject Alternative Name omits the
  # Service hostname, a NetworkPolicy selecting a label no pod carries — all are
  # valid YAML, and all break the deployment. Two of them did break it while
  # phase 7 was being built.
  #
  # SECURITY: like the job above, this needs no secrets. The database password,
  # the session signing key and the TLS material are generated inside the
  # cluster by `npm run k8s:up` and are destroyed with the runner.
  containers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Proves both images build on Linux, which is not redundant with a local
      # build: development happens on Windows, and the Dockerfile's `npm ci` is
      # exactly where a lockfile generated on Windows fails — the @emnapi
      # entries that @tailwindcss/oxide-wasm32-wasi needs get silently dropped,
      # and nothing notices until an install runs on Linux.
      - name: Build the container images
        run: |
          docker build --target app   -t cloudsentinel:app   .
          docker build --target tools -t cloudsentinel:tools .

      # A fast check that the images work at all, before spending time on a
      # cluster.
      #
      # `--network host` puts the containers on the runner's own network
      # namespace, so Postgres is reachable at 127.0.0.1 — which is loopback, so
      # lib/db/client.ts connects without TLS. That is the intended behaviour
      # being exercised rather than a workaround: the TLS requirement applies to
      # connections that cross a network, and this one does not. The TLS path is
      # covered by the cluster deployment further down, where the database is
      # reached by Service name.
      - name: Start a database for the smoke test
        run: |
          docker run -d --name smoke-db \
            -e POSTGRES_USER=cloudsentinel \
            -e POSTGRES_PASSWORD=ci-throwaway-not-a-secret \
            -e POSTGRES_DB=cloudsentinel \
            -p 127.0.0.1:5432:5432 \
            postgres:17-alpine
          for _ in $(seq 30); do
            docker exec smoke-db pg_isready -U cloudsentinel && break
            sleep 2
          done

      # Also proves the dependency prune in the `tools` stage did not remove
      # something the CLIs need. The Dockerfile checks the module graph loads at
      # build time; this checks it actually runs.
      - name: Migrate with the tools image
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PASSWORD=ci-throwaway-not-a-secret \
            cloudsentinel:tools node scripts/db.ts migrate

      - name: Smoke-test the dashboard image
        run: |
          docker run -d --name smoke-app --network host \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PASSWORD=ci-throwaway-not-a-secret \
            -e CLOUDSENTINEL_JWT_SECRET=ci-smoke-test-only-not-a-secret-value \
            cloudsentinel:app

          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:3000/api/healthz > /dev/null && break
            sleep 2
          done

          # The two probes must behave differently, which is the whole reason
          # there are two: liveness answers whenever the process is up,
          # readiness only when the database is reachable.
          echo "liveness:  $(curl -sf http://127.0.0.1:3000/api/healthz)"
          echo "readiness: $(curl -sf http://127.0.0.1:3000/api/readyz)"

          # An unauthenticated API request must be refused. A dashboard that
          # served findings to anyone would be a worse hole than any the scanner
          # reports, so it is checked against the real image rather than only in
          # the unit tests.
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/findings)
          test "$code" = "401" || { echo "expected 401 from /api/findings, got $code"; exit 1; }

          docker rm -f smoke-app smoke-db

      # Scans both images for known vulnerabilities.
      #
      # Run from Trivy's own image rather than through a marketplace action —
      # the same reasoning as installing kind by hand below: one fewer
      # third-party action in the supply chain of a project about supply chains.
      #
      # The images are handed over as tarballs from `docker save` rather than by
      # mounting the Docker socket into the scanner. Mounting the socket grants
      # the container root-equivalent control of the host daemon, which is a
      # large privilege to hand a tool purely so it can read a filesystem layer.
      # A tarball is the same data with none of the authority.
      #
      # `--ignore-unfixed` and `--severity CRITICAL` together are what make this
      # a gate rather than a nuisance. A critical vulnerability *with a fix
      # available* is actionable — rebuild on a newer base image — so failing
      # the build is a fair response. A critical one with no fix yet published
      # cannot be acted on, and turning the repository red for something nobody
      # can do anything about trains people to ignore the signal, which costs
      # more than it saves. Everything below CRITICAL is reported in the step
      # above without failing, so it is visible without being noise.
      - name: Scan the images for vulnerabilities (report)
        run: |
          docker save cloudsentinel:app   -o /tmp/app.tar
          docker save cloudsentinel:tools -o /tmp/tools.tar
          for image in app tools; do
            echo "::group::trivy report - cloudsentinel:$image"
            docker run --rm -v /tmp:/scan aquasec/trivy:latest image \
              --input "/scan/$image.tar" \
              --scanners vuln \
              --severity MEDIUM,HIGH,CRITICAL \
              --exit-code 0 \
              --no-progress
            echo "::endgroup::"
          done

      - name: Fail on fixable critical vulnerabilities
        run: |
          for image in app tools; do
            docker run --rm -v /tmp:/scan aquasec/trivy:latest image \
              --input "/scan/$image.tar" \
              --scanners vuln \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress
          done

      # Installed directly rather than through a third-party action, and pinned
      # to a version. One fewer action in the supply chain of a project about
      # security, and the URL states exactly what is being downloaded.
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create the cluster
        run: npm run k8s:cluster

      - name: Build and load the images
        run: npm run k8s:build

      # The real test: the same command a developer runs. A deployment that has
      # drifted out of working order fails here rather than the next time
      # somebody tries to demonstrate it.
      - name: Deploy
        run: npm run k8s:up

      - name: Check the dashboard answers through the NodePort
        run: |
          curl -sf http://localhost:30080/api/healthz
          curl -sf http://localhost:30080/api/readyz
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:30080/api/findings)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }

      # Confirms the dashboard's database connections are genuinely encrypted
      # and verified, rather than having quietly fallen back to plaintext.
      #
      # `pg_stat_ssl` reports what the server actually negotiated, which is the
      # only trustworthy source: the client asked for a verified TLS connection,
      # and this is the server agreeing that it got one. Because the client sets
      # `rejectUnauthorized: true` with the private CA, a row here also means
      # certificate and hostname verification succeeded — a wrong Subject
      # Alternative Name would have failed the connection outright.
      - name: Verify the database connections are TLS-verified
        run: |
          kubectl exec -n cloudsentinel cloudsentinel-db-0 -- \
            psql -U cloudsentinel -d cloudsentinel -tAc \
            "select count(*) from pg_stat_ssl join pg_stat_activity using (pid) where ssl and backend_type='client backend';" \
            | tee /tmp/ssl-count.txt
          test "$(tr -d '[:space:]' < /tmp/ssl-count.txt)" -ge 1 || {
            echo "no TLS-encrypted client connections found"
            exit 1
          }

      # Verifies the NetworkPolicy is enforced, not merely stored. The reasoning
      # for why this needs checking at all is in the probe manifest itself.
      - name: Verify the database is unreachable without the db-client label
        run: |
          kubectl apply -f k8s/test/netpol-probe.yaml
          # The probe's success path is a 15 second connection timeout, so wait
          # for the pod to finish rather than polling it.
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded \
            pod/netpol-probe -n cloudsentinel --timeout=120s || true
          kubectl logs -n cloudsentinel netpol-probe | tee /tmp/netpol.txt
          phase=$(kubectl get pod netpol-probe -n cloudsentinel -o jsonpath='{.status.phase}')
          kubectl delete -f k8s/test/netpol-probe.yaml --ignore-not-found
          grep -q BLOCKED /tmp/netpol.txt || {
            echo "NetworkPolicy is NOT enforced: the database was reachable (phase $phase)"
            exit 1
          }

      # Always runs, so a failed deployment leaves enough behind to diagnose
      # rather than just a red cross. Pod status plus recent events is usually
      # the whole story — an ImagePullBackOff, a failing probe, a missing Secret.
      - name: Diagnostics
        if: always()
        run: |
          kubectl get all,networkpolicy,pvc -n cloudsentinel || true
          kubectl describe pods -n cloudsentinel || true
          kubectl logs -n cloudsentinel -l app.kubernetes.io/name=cloudsentinel-app --tail=50 --all-containers || true
          kubectl get events -n cloudsentinel --sort-by=.lastTimestamp || true
