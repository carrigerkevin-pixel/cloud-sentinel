# CloudSentinel — in-cluster PostgreSQL.
#
# What this is: the database holding scan history, finding lifecycle, users,
# triage decisions and anomaly runs — the Kubernetes counterpart of the `db`
# service in docker-compose.yml.
#
# Where it fits in the architecture: everything upstream of it (collectors, rule
# engine, ML layer) is stateless and recomputes from scratch on every run. This
# is the only component in the project that remembers anything, and the only
# one whose loss cannot be repaired by re-running something.
#
#   collectors --> rule engine --> [ this database ] --> dashboard (30-app.yaml)
#
# Applied by `npm run k8s:up`. Requires the `cloudsentinel-db` Secret, which
# that script creates — it holds the password and the TLS key, so it is
# generated at deploy time and never committed. See scripts/k8s.ts.
#
# ===========================================================================
# Why a StatefulSet and not a Deployment
# ===========================================================================
#
# A Deployment treats its pods as interchangeable: during an update it may start
# a replacement before removing the old one. For a database backed by a single
# ReadWriteOnce volume that is a specific disaster — two Postgres processes
# pointed at one data directory corrupt it. A StatefulSet gives a stable
# identity, an ordered lifecycle that stops the old pod before starting the new,
# and a volumeClaimTemplate whose PersistentVolumeClaim is *not* deleted when
# the StatefulSet is, so `kubectl delete` on the workload does not silently
# destroy the scan history.
#
# The `first_seen_at` date on a finding — the thing that lets the dashboard
# answer "public since the 4th of August" — is the one value in this project
# that cannot be regenerated by re-running a command. That is what the extra
# care is protecting.
---
# The headless Service.
#
# `clusterIP: None` means no load-balancer address is allocated; DNS resolves
# `cloudsentinel-db` straight to the pod. For a single-writer database that is
# what is wanted — connections should reach *the* database, not be balanced
# across whatever happens to match the selector.
#
# The name matters beyond service discovery: it is the hostname the application
# connects to, so it is also the name the TLS certificate must be issued for.
# scripts/k8s.ts issues the certificate with exactly these names in its Subject
# Alternative Name list. Renaming this Service without reissuing the certificate
# breaks every connection with a hostname-verification failure.
apiVersion: v1
kind: Service
metadata:
  name: cloudsentinel-db
  namespace: cloudsentinel
  labels:
    app.kubernetes.io/name: cloudsentinel-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cloudsentinel
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cloudsentinel-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudsentinel-db
  namespace: cloudsentinel
  labels:
    app.kubernetes.io/name: cloudsentinel-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cloudsentinel
spec:
  serviceName: cloudsentinel-db
  # Exactly one. Postgres replication is a real subject and this project does
  # not implement it; running two replicas of this manifest would give two
  # independent databases racing for one volume, not high availability.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudsentinel-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudsentinel-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: cloudsentinel
    spec:
      securityContext:
        # uid/gid 70 is the `postgres` account in postgres:17-alpine
        # specifically. The Debian-based image uses 999 — a detail worth stating
        # because switching the base image without changing these numbers
        # produces a pod that starts as the wrong user and cannot read its own
        # data directory.
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        # fsGroup does two jobs here, and the second is the subtle one:
        #
        #   1. It makes the persistent volume group-writable by gid 70, so a
        #      non-root Postgres can initialise its data directory.
        #   2. It sets the group owner of the mounted TLS files. Postgres
        #      refuses to start if its private key is readable by anyone beyond
        #      its owner and group, so the key is mounted mode 0640 owned by
        #      root:70 — readable by Postgres, invisible to everyone else. Drop
        #      this line and the key ends up in group root, which Postgres can
        #      no longer read.
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Pinned to a major version rather than `latest`. A silent major
          # upgrade of a database is how a working project breaks after an image
          # pull — Postgres refuses to start against a data directory written by
          # a different major, and the failure surfaces long after the change
          # that caused it. Same reasoning, same pin, as docker-compose.yml.
          image: postgres:17-alpine

          # SECURITY: TLS is switched on here, and this is the reason the whole
          # certificate apparatus in scripts/k8s.ts exists.
          #
          # lib/db/client.ts requires certificate-verified TLS for any database
          # host that is not loopback. In a cluster the database is reached at
          # `cloudsentinel-db`, so that rule applies to every connection — and
          # the honest way to satisfy it is to give Postgres a certificate,
          # rather than to add a switch that skips verification. An
          # encrypted-but-unverified connection is one that anything able to
          # answer on this Service address can terminate and read, and scan
          # findings are a ranked list of where the environment is weakest.
          #
          # `ssl_ca_file` is set as well so the server can *request* a client
          # certificate. Nothing presents one yet — the client authenticates
          # with a password — but naming the CA here is what leaves the door
          # open to mutual TLS later without reissuing anything.
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/cloudsentinel-tls/tls.crt
            - -c
            - ssl_key_file=/etc/cloudsentinel-tls/tls.key
            - -c
            - ssl_ca_file=/etc/cloudsentinel-tls/ca.crt

          ports:
            - name: postgres
              containerPort: 5432

          env:
            # SECURITY: the password comes from a Secret, never from this file.
            # This manifest is committed to a public repository; a literal value
            # here would be a published credential, and one that would go on
            # being published in the git history after it was removed.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudsentinel-db
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              value: cloudsentinel
            - name: POSTGRES_DB
              value: cloudsentinel
            # Postgres refuses to initialise a data directory with a locale
            # mismatch on some hosts; setting it explicitly makes the container
            # behave identically on every machine.
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=C"
            # A subdirectory of the mount rather than the mount itself. Some
            # volume providers place a `lost+found` directory at the root of a
            # fresh volume, and initdb refuses to run in a directory that is not
            # empty. Pointing PGDATA one level down sidesteps that entirely.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /etc/cloudsentinel-tls
              readOnly: true
            # Postgres writes its unix socket and lock files here. With
            # `readOnlyRootFilesystem` below there is nowhere else for them to
            # go, and the server exits at startup if it cannot create them.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp

          # `pg_isready` rather than a TCP check. Postgres accepts connections
          # for a second or two before it is able to serve queries, and the
          # migration Job starts the moment this reports ready — a TCP-only
          # probe makes the first migration fail intermittently.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cloudsentinel", "-d", "cloudsentinel"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          # Deliberately slower and more forgiving than readiness. Failing this
          # probe kills the database; a slow query or a checkpoint pause must
          # not be mistaken for a hung process.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cloudsentinel", "-d", "cloudsentinel"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            # Requests are what the scheduler reserves; limits are the ceiling.
            # Both are set because a pod with neither is the first thing evicted
            # when a node runs short of memory — which on a laptop running
            # Docker Desktop, a cluster and a browser is not a remote scenario.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            # Every item below is required by the `restricted` Pod Security
            # Standard enforced on the namespace (see 00-namespace.yaml). They
            # are written out rather than left to a default so that reading this
            # manifest tells you what the container can do.
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
            # The database writes only to the paths mounted above. Everything
            # else — including the directory holding the Postgres binaries — is
            # immutable, so a compromised process cannot drop a payload into the
            # image and have it survive, nor overwrite the server it is running.
            readOnlyRootFilesystem: true

      volumes:
        - name: tls
          secret:
            secretName: cloudsentinel-db-tls
            # 0640, not the 0644 default. Postgres inspects the permissions of
            # its private key at startup and refuses to run if the file is
            # world-readable — a check worth having, since a key readable by
            # every process in the container is a key that only encrypts
            # traffic against outsiders.
            defaultMode: 0640
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}

  # The PersistentVolumeClaim template.
  #
  # Deliberately outside `spec.template`: a claim created here survives deletion
  # of the StatefulSet. `kubectl delete statefulset cloudsentinel-db` therefore
  # removes the database *process* and keeps its data, and recreating the
  # StatefulSet reattaches the same volume. Removing the data is a separate,
  # explicit act — `npm run k8s:down -- --purge`, which says what it is doing.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Generous for a project whose largest table is a few thousand
            # finding occurrences. Sized for the fact that expanding a volume
            # later is more work than over-asking now, and this is a local
            # cluster where the storage is a directory on the host.
            storage: 2Gi
